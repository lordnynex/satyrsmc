services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: satyrsmc
      POSTGRES_USER: satyrs
      POSTGRES_PASSWORD: satyrs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ../..
      dockerfile: packages/api/Dockerfile
    environment:
      DATABASE_URL: postgres://satyrs:satyrs@postgres:5432/satyrsmc
    ports:
      - "4000:3000"
    depends_on:
      - postgres

volumes:
  pgdata:
