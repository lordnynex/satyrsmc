services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: badger
      POSTGRES_USER: badger
      POSTGRES_PASSWORD: badger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ../..
      dockerfile: packages/api/Dockerfile
    environment:
      DATABASE_URL: postgres://badger:badger@postgres:5432/badger
    ports:
      - "3000:3000"
    depends_on:
      - postgres

volumes:
  pgdata:
